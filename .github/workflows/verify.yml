name: Verify ORL-AI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - python: '3.9'
            node: '18'
          - python: '3.12'
            node: '20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime.node }}
      - run: python -B VERIFY_ALL.py
      - name: Confirm committed verification artifacts
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  selected-file-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected-file manifest
        run: |
          if [ -f hashes/SHA256SUMS.txt ]; then
            sha256sum -c hashes/SHA256SUMS.txt
          else
            echo "Selected-file manifest is not present. Generate it after the final file freeze."
          fi

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -B verifier/ORL_AI_Determinism_Verifier_v5_0_0.py
